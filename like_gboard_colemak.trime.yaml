# Trime custom style settings
# encoding: utf-8

config_version: "3.0"
name: 仿 Gboard          #方案名稱
author: 認真的π        #作者信息

#鍵盤高度
height:
  1: &jpgd1 30 #表情鍵盤
  2: &jpgd2 24 #顏文字鍵盤1
  3: &jpgd3 24 #顏文字鍵盤2
  4: &jpgd4 48 #主鍵盤（對齊 tongwenfeng key_height）
  5: &jpgd5 39.5 #符號鍵盤（tongwenfeng 的 symbols/numberb 均爲 39.5）
  6: &hgap 4 #鍵盤橫縫大小（dp），對齊 tongwenfeng
  7: &sgap 10 #鍵盤豎縫大小（dp），實測對齊同文風觀感（鍵矮縫大）

#鍵盤高度
round_corner:
  1: &round1 8 #按鍵圓角半徑（按 commit 歷史中 Gboard 參考圖實測換算）
  2: &round2 0 #候選窗口圓角（對齊 tongwenfeng）
  3: &round3 50 #回車鍵圓角（膠囊形，還原原版 Gboard 風格）

#界面風格、功能開關
style:
  auto_caps: false #自動句首大寫:true|false|ascii
  candidate_font: han.ttf  #候選字體
  candidate_padding: 5  #候選項水平內邊距（dp），相鄰候選項的實際間距 = 2 × 此值
  candidate_spacing: 0.5  #候選分割線寬度（dp，與 trime.yaml 默認一致）
  candidate_text_size: 18 #候選字號（對齊 tongwenfeng）
  candidate_use_cursor: true #候選光標高亮（對齊 tongwenfeng）
  candidate_corner_radius: *round1 #候選高亮背景圓角（與按鍵圓角一致）
  candidate_view_height: 28 #候選高亮塊高度（chip 實際高度取此值，對齊 tongwenfeng）
  comment_height: 14 #編碼提示區高度（對齊 tongwenfeng；comment_position: right 時僅參與候選欄總高度）
  color_scheme: default #配色方案（新版改爲在 Trime 設置中選擇，此鍵已無效但保留）
  comment_font: comment.ttf #編碼提示字體
  comment_position: right #編碼提示位置：right / top / overlay（仿 Gboard/fcitx5：候選單行，提示小字在右；right 模式下 comment_height 不參與條目佈局，僅抬高候選欄總高）
  comment_text_size: 12 #編碼提示字號
  hanb_font: hanb.ttf #擴充字體
  horizontal_gap: *hgap #鍵水平間距（dp）
  key_height: *jpgd4 #鍵高
  key_long_text_size: 16 #長標籤字號
  key_text_size: 24 #鍵字號
  key_width: 10.0 #鍵寬，佔屏幕寬的百分比
  key_font: symbol.ttf #按鍵符號字體（對齊 tongwenfeng）
  keyboards: [.default, letter, default, number, symbols, edit, move, bqrw1, bqrw2, bqrw3, bqrw4, bqrw5, bqrw6, bqqt1, bqqt2, bqqt3, bqqt4, bqqz1, bqqz2, bqqz3, bqqz4, bqqz5, bqqz6, bqpt1, bqpt2, bqhd1, bqhd2, bqhc1, bqhc2, bqhc3, bqlx1, bqlx2, bqlx3, bqlx4, bqlx5, bqlx6, bqkj1, bqkj2, bqkj3, bqkj4, bqkj5, bqfh1, bqfh2, bqfh3, bqfh4, kao_fond, kao_sad, kao_mad, kao_astonished, kao_impotent, kao_happy, numberb] #鍵盤配置
  label_text_size: 22 #標籤字號
  label_font: label.ttf #編標籤字體
  latin_font: latin.ttf #西文本體
  latin_locale: en_US #西文語言
  locale: zh_CN #缺省語言 zh_TW,zh_CN,zh_HK,""
  keyboard_height: 250 #鎖定鍵盤高度，避免切換時鍵盤高度變化而造成閃爍
  keyboard_height_land: 200 #鎖定橫屏下鍵盤高度，避免切換時鍵盤高度變化而造成閃爍
  keyboard_padding: 0 #鍵盤區內邊距（對齊 trime.yaml）
  keyboard_padding_bottom: 0
  keyboard_padding_left: 0
  keyboard_padding_right: 0
  popup_font: latin.ttf #按鍵提示字體（替代舊版 preview_font）
  popup_height: 40 #按鍵提示氣泡高度（dp，用於氣泡定位，應與 popup_key_height 一致）
  popup_key_height: 40 #氣泡內文字行高（dp；不設置時爲 0，氣泡中的文字會因高度爲 0 而不可見）
  popup_text_size: 40 #按鍵提示字號（替代舊版 preview_text_size）
  reset_ascii_mode_on_focus_change: false #焦點變更彈起鍵盤時重置爲中文狀態（替代舊版 reset_ascii_mode）
  round_corner: *round1 #按鍵圓角半徑
  shadow_radius: 0.0 #按鍵陰影半徑
  proximity_correction: true #按鍵誤觸糾正（對齊 tongwenfeng）
  vertical_correction: "-5" #垂直點擊修正（對齊 tongwenfeng）
  horizontal: true #候選水平排列（對齊 tongwenfeng）
  symbol_font: symbol.ttf #符號字體
  symbol_text_size: 10 #符號字號
  text_font: latin.ttf #編碼字體
  vertical_gap: *sgap #鍵盤行距（dp）
  enter_label_mode: 0  #是否使用App提供的ActionLabel內容作爲Enter鍵的文本（由於多數App沒有適配ActionLable，實際影響不大）。0不使用，1只使用actionlabel，2優先使用，3當其他方式沒有獲得label時纔讀取actionlabel
  enter_labels:  # 定義Enter鍵的文本
    go: 前往
    done: 完成
    next: 下個
    pre:  上個
    search: 搜索
    send: 發送
    default: Enter   # 定義默認Enter鍵的文本

# 預編輯（編碼）區參數，替代舊版 style.text_size
preedit:
  alpha: 1 #不透明（新版默認 0.8 會半透明）
  foreground:
    font_size: 16 #編碼區字號（對齊 tongwenfeng）
  horizontal_padding: 8 #編碼區水平內邊距（對齊 tongwenfeng）
  top_end_radius: 4 #編碼區背景頂部圓角（對齊 tongwenfeng）

# 候選懸浮窗參數，替代舊版 style.layout / style.window
window:
  insets:               # 窗口內邊距（原 layout.margin_x / margin_y，對齊 trime.yaml 的 4）
    vertical: 4
    horizontal: 4
  item_padding:         # 候選項水平內邊距（對齊 trime.yaml 的 4）
    horizontal: 4
  min_width: 0          # 原layout.min_width
  corner_radius: *round2 # 原layout.round_corner 候選窗口圓角
  border: 0             # 原layout.border
  alpha: 1              # 原layout.alpha 0xff（新版爲 0~1 浮點）
  foreground:           # 前景字號（原候選字號20 / 編碼提示12；對齊 tongwenfeng 的 comment 16）
    label_font_size: 20
    text_font_size: 20
    comment_font_size: 16

# 候選欄工具條（Trime 3.3.x：無編碼輸入時 QuickBar 顯示的按鈕組，配置參照官方同文風主題）
# 左側 primary_button 固定；buttons 從右向左排列；ic@ 前綴爲應用內置 Material 圖標。
tool_bar:
  button_spacing: 5 # 按鈕間距
  button_font: iconfont.ttf # 按鈕字體（ic@ 圖標由應用內置 Iconics 渲染，不依賴此字體文件）
  back_style: "ic@arrow-left" # 左側返回按鈕樣式
  # 左側固定主按鈕：彈出切換選項菜單，長按進入設置
  primary_button:
    background:
      type: circle # 高亮形狀 circle|rectangle
      corner_radius: *round1 # 與按鍵圓角一致
      normal: 0x00 # 正常狀態背景（透明）
      highlight: hilited_candidate_button_color # 高亮狀態背景色
      vertical_inset: 4
      horizontal_inset: 4
    foreground:
      style: "ic@dots_horizontal"
      normal: candidate_text_color
      padding: 10
    action: menu_keyboard
    long_press_action: Settings
  hide_button: &hide_button
    foreground:
      style: "ic@keyboard_close"
      normal: candidate_text_color
    action: Hide
  emoji_button: &emoji_button
    foreground:
      style: "ic@emoticon"
    action: liquid_keyboard_emoji
  clipboard_button: &clipboard_button
    foreground:
      style: "ic@clipboard"
    action: liquid_keyboard_clipboard # 經兼容處理：新版引擎打開剪貼板窗口，舊版打開剪貼標籤頁
  edit_button: &edit_button
    foreground:
      style: "ic@cursor_text"
    action: Keyboard_numberb # 編輯鍵盤（本主題無 editor 鍵盤，由 numberb 承擔）
  henkan_button: &henkan_button
    foreground:
      option_styles: ["簡", "繁"] # 根據 action 的 toggle 狀態切換顯示
      font_size: 18
      padding: 10
    action: Henkan
  full_shape_button: &full_shape_button
    foreground:
      option_styles: ["ic@moon_full", "ic@moon_new"]
    action: Zenkaku_Hankaku
  # 右側按鈕列表（從右向左排列；視覺從左到右 = 簡繁、全半角、編輯、剪貼板、表情、收起）
  buttons: [ *hide_button, *emoji_button, *clipboard_button, *edit_button, *full_shape_button, *henkan_button ]

# 最好保留一項，防止其他主題使用 __include 時無法加載
fallback_colors:
  candidate_text_color: text_color
  root_background: keyboard_back_color # 整個鍵盤區+候選欄的背景色（原 style.root_background，新版改爲在此定義）
# 以下值是程序內置的，你也可以在這裏自定義，這會覆蓋默認值
#
#  comment_text_color: candidate_text_color
#  border_color: back_color
#  candidate_separator_color: border_color
#  hilited_text_color: text_color
#  hilited_back_color: back_color
#  hilited_candidate_text_color: hilited_text_color
#  hilited_candidate_back_color: hilited_back_color
#  hilited_label_color: hilited_candidate_text_color # 高亮候選序號 顏色
#  hilited_comment_text_color: comment_text_color
#  hilited_key_back_color: hilited_candidate_back_color
#  hilited_key_text_color: hilited_candidate_text_color
#  hilited_key_symbol_color: hilited_comment_text_color
#  hilited_off_key_back_color: hilited_key_back_color
#  hilited_on_key_back_color: hilited_key_back_color
#  hilited_off_key_text_color: hilited_key_text_color
#  hilited_on_key_text_color: hilited_key_text_color
#  key_back_color: back_color
#  key_border_color: border_color
#  key_text_color: candidate_text_color
#  key_symbol_color: comment_text_color
#  label_color: candidate_text_color
#  off_key_back_color: key_back_color
#  off_key_text_color: key_text_color
#  on_key_back_color: hilited_key_back_color
#  on_key_text_color: hilited_key_text_color
#  popup_back_color: key_back_color
#  popup_text_color: key_text_color
#  shadow_color: border_color
#  root_background: back_color # 整個鍵盤區+候選欄的背景圖/色
#  candidate_background: back_color #候選欄的整體背景圖/色
#  keyboard_back_color: border_color #鍵盤區的背景圖/色
#  liquid_keyboard_background: keyboard_back_color # liquidKeyboard的背景圖/色
#  text_back_color: back_color #編碼區背景，即懸浮窗背景
#  long_text_back_color: key_back_color #長文本按鍵的背景(剪貼板）

#顏色
colors:
  1: &color1 0xffE2E3E5 #按鍵文本
  2: &color2 0xff2E353B #按鍵背景
  3: &color3 0xff1B2026 #鍵盤背景
  4: &color4 0xff40474D #功能鍵背景
  5: &color5 0xff131313 #黑色文字
  6: &color6 0xff75D2FE #回車鍵背景
  7: &color7 0xffB4CAD7 #數字鍵顏色
  8: &color8 0xff838383  #按鍵關閉狀態文本
  9: &color9 0xff565B5F #高亮按鍵文本
  10: &color10 0xff333A40 #高亮候選背景
  11: &color11 0xff8A9197 #高亮功能背景

  12: &color12 0xffF0F3F8 #鍵盤背景
  13: &color13 0xff1F1F1F #按鍵文本
  14: &color14 0xffFFFFFF #按鍵背景
  15: &color15 0xffE1E3E0 #功能鍵背景
  16: &color16 0xffB2B3B7 #高亮按鍵文本
  17: &color17 0xff6495C0 #回車鍵背景（淺色主題色，取自截圖 #6495C0）
  18: &color18 0xffC9CBC8 #高亮功能背景
  19: &color19 0xffD8DBE0 #高亮候選背景
  20: &color20 0xffD5E4F7 #功能鍵淺藍（取自 Gboard 參考圖）
  
#配色方案
preset_color_schemes:
  default:
    name: "藍色日間"  #方案名稱
    author: 認真的π #作者信息
    dark_scheme: dark
    back_color: *color12 #候選區背景狀態欄
    candidate_separator_color: *color14 #候選分割背景
    candidate_text_color: *color13 #候選文本
    comment_text_color: *color13 #提示
    hilited_back_color: *color14 #高亮編碼背景
    hilited_candidate_back_color: *color20 #高亮候選背景（淺藍）
    hilited_candidate_text_color: *color13 #高亮候選文本
    hilited_candidate_button_color: *color20 #候選欄按鈕高亮（淺藍）
    hilited_comment_text_color: *color13 #高亮提示
    hilited_key_back_color: *color12 #高亮按鍵背景
    hilited_key_symbol_color: *color14 #高亮按鍵符號
    hilited_key_text_color: *color16 #高亮按鍵文本
    hilited_off_key_back_color: *color14 #高亮按鍵關閉狀態背景
    hilited_off_key_text_color: *color1 #高亮按鍵關閉狀態文本
    hilited_text_color: *color13 #高亮編碼
    key_back_color: *color14 #按鍵背景
    key_symbol_color: *color8 #按鍵符號（灰色 0xff838383，同 tongwenfeng）
    key_text_color: *color13 #按鍵文本
    keyboard_back_color: *color12 #鍵盤背景
    label_color: *color17 #標籤
    off_key_back_color: *color20  #按鍵關閉狀態背景（淺藍）
    off_key_text_color: *color8 #按鍵關閉狀態文本
    popup_back_color: *color2 #按鍵提示背景
    popup_text_color: *color13 #按鍵提示文本
    text_color: *color17 #編碼
    text_back_color: *color14 #編碼區背景（白色，保證藍色編碼可讀）
    bkg: *color14 #空格鍵背景色
    tkg: *color13 #空格鍵文字顏色
    benter: *color17 #回車鍵背景色
    tenter: *color14 #回車鍵文字顏色
    bgn: *color20 #功能鍵背景色（淺藍）
    tgn: *color13 #功能鍵文字顏色
    bbs: *color20 #退格鍵背景色（淺藍）
    tbs: *color13 #退格鍵文字顏色
    baoe: *color14 #aoeiu背景色
    taoe: *color17 #aoeiu文字顏色
    bh1: *color14 #第一行背景色
    th1: *color13 #第一行文字顏色
    bh2: *color14 #第二行背景色
    th2: *color13 #第二行文字顏色
    bh3: *color14 #第三行背景色
    th3: *color13 #第三行文字顏色
    bh4: *color14 #第四行背景色
    th4: *color13 #第四行文字顏色
    num: *color20 #數字鍵顏色（淺藍）
    ntb: *color13 #數字鍵文字顏色
    gnb: *color18 #高亮功能鍵

  dark:
    name: "藍色夜間"  #方案名稱
    author: 認真的π #作者信
    back_color: *color3 #候選區背景狀態欄
    candidate_separator_color: *color2 #候選分割背景
    candidate_text_color: *color1 #候選文本
    comment_text_color: *color1 #提示
    hilited_back_color: *color2 #高亮編碼背景
    hilited_candidate_back_color: *color10 #高亮候選背景（深色模式維持原配色）
    hilited_candidate_text_color: *color1 #高亮候選文本
    hilited_comment_text_color: *color1 #高亮提示
    hilited_key_back_color: *color3 #高亮按鍵背景
    hilited_key_symbol_color: *color2 #高亮按鍵符號
    hilited_key_text_color: *color9 #高亮按鍵文本
    hilited_off_key_back_color: *color2 #高亮按鍵關閉狀態背景
    hilited_off_key_text_color: *color1 #高亮按鍵關閉狀態文本
    hilited_text_color: *color1 #高亮編碼
    key_back_color: *color2 #按鍵背景
    key_symbol_color: *color1 #按鍵符號
    key_text_color: *color1 #按鍵文本
    keyboard_back_color: *color3 #鍵盤背景
    label_color: *color6 #標籤
    off_key_back_color: *color4  #按鍵關閉狀態背景
    off_key_text_color: *color8 #按鍵關閉狀態文本
    popup_back_color: *color2 #按鍵提示背景
    popup_text_color: *color1 #按鍵提示文本
    text_color: *color6 #編碼
    text_back_color: *color2 #編碼區背景
    bkg: *color2 #空格鍵背景色
    tkg: *color1 #空格鍵文字顏色
    benter: *color6 #回車鍵背景色
    tenter: *color5 #回車鍵文字顏色
    bgn: *color4 #功能鍵背景色（深色模式維持原配色）
    tgn: *color1 #功能鍵文字顏色
    bbs: *color4 #退格鍵背景色
    tbs: *color2 #退格鍵文字顏色
    baoe: *color2 #aoeiu背景色
    taoe: *color6 #aoeiu文字顏色
    bh1: *color2 #第一行背景色
    th1: *color1 #第一行文字顏色
    bh2: *color2 #第二行背景色
    th2: *color1 #第二行文字顏色
    bh3: *color2 #第三行背景色
    th3: *color1 #第三行文字顏色
    bh4: *color2 #第四行背景色
    th4: *color1 #第四行文字顏色
    num: *color7 #數字鍵顏色
    ntb: *color5 #數字鍵文字顏色
    gnb: *color11 #高亮功能鍵

liquid_keyboard:
  # 目前只能直接寫參數，不支持變量或者fallback機制。
  # 缺少參數時，自動從style中加載參數。除非需要指定liquid_keyboard使用與主鍵盤不同的背景色、背景圖，否則不應設置被註釋掉的參數。
  author: "tumuyan"
  row: 6              #每屏最多顯示多少行按鍵（3.3.x 引擎不讀取此鍵；保留以兼容更舊的引擎）
  row_land: 5         #橫屏每屏最多顯示多少行按鍵（同上）
  key_height: 40      #按鍵高度（3.3.x 引擎按文字自適應高度，此值僅作參考）
  key_height_land: 40 #橫屏模式按鍵高度（同上）
  single_width: 60    #single類型的按鍵寬度
  vertical_gap: 8     #縱向按鍵間隙（對齊 tongwenfeng；3.3.x 引擎不讀取此鍵，保留以兼容更舊的引擎）
  margin_x: 5         #按鍵間隙（左右上下統一使用此值；取 5 與官方默認/同文風主題一致）
  fixed_key_bar: # 固定按鍵條
    position: bottom  # 擺放位置（在滾動區域的……） top|bottom|left|right
    keys: # 按鍵（顯示名稱爲對應的label，不能放太多）
      - liquid_keyboard_exit
      - space1
      - BackSpace
      - Return2
      - liquid_keyboard_clipboard
      - liquid_keyboard_tabs
