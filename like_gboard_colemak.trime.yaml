#鍵盤佈局
preset_keyboards:
  default:
    author: "Sokny"
    name: Colemak 佈局
    width: 10  # 保持總寬度基準（實際按100單位計算）
    ascii_mode: 0
    key_symbol_offset_y: 3 #助記符號偏移（正值向下微調）
    keys:
      # 第1行：
      - {click: q, long_click: 1, key_back_color: bh1, key_text_color: th1}
      - {click: w, long_click: 2, key_back_color: bh1, key_text_color: th1}
      - {click: f, long_click: 3, key_back_color: bh1, key_text_color: th1}  # 替換e爲f
      - {click: p, long_click: 4, key_back_color: bh1, key_text_color: th1}  # 替換r爲p
      - {click: g, long_click: 5, key_back_color: bh1, key_text_color: th1}  # 替換t爲g
      - {click: j, long_click: 6, key_back_color: bh1, key_text_color: th1}  # 替換y爲j
      - {click: l, long_click: 7, key_back_color: bh1, key_text_color: th1}  # 替換u爲l
      - {click: u, long_click: 8, key_back_color: bh1, key_text_color: th1}  # 替換i爲u
      - {click: y, long_click: 9, key_back_color: bh1, key_text_color: th1}  # 替換o爲y
      - {click: ';', long_click: 0, key_back_color: bh1, key_text_color: th1}  # 替換p爲;

      # 第2行：
      - {click: a, long_click: select_all, key_back_color: bh2, key_text_color: th2}
      - {click: r, long_click: '@', key_back_color: bh2, key_text_color: th2}  # 替換s爲r
      - {click: s, long_click: '#', key_back_color: bh2, key_text_color: th2}  # 替換d爲s
      - {click: t, long_click: '$', key_back_color: bh2, key_text_color: th2}  # 替換f爲t
      - {click: d, long_click: '%', swipe_down: "date_time", key_back_color: bh2, key_text_color: th2}  # 替換g爲d
      - {click: h, long_click: '^', swipe_down: "+", key_back_color: bh2, key_text_color: th2}  # 保持h
      - {click: n, long_click: '&', swipe_down: "-", key_back_color: bh2, key_text_color: th2}  # 替換j爲n
      - {click: e, long_click: '*', swipe_down: "_", key_back_color: bh2, key_text_color: th2}  # 替換k爲e
      - {click: i, long_click: '(){Left}', swipe_down: "=", key_back_color: bh2, key_text_color: th2}  # 替換l爲i
      - {click: o, long_click: '[]{Left}', swipe_down: "/", key_back_color: bh2, key_text_color: th2}

      # 第3行：
      - {click: Shift_L, composing: delimiter, width: 15, hilited_key_back_color: gnb, hilited_key_text_color: tgn, key_back_color: bbs, key_text_color: th3}
      - {click: z, long_click: '~', swipe_down: '/', key_back_color: bh3, key_text_color: th3}
      - {click: x, long_click: '、', swipe_down: '{}{Left}', key_back_color: bh3, key_text_color: th3}
      - {click: c, long_click: copy, swipe_down: ' ', key_back_color: bh3, key_text_color: th3}
      - {click: v, long_click: paste_clip, swipe_down: paste, key_back_color: bh3, key_text_color: th3}
      - {click: b, long_click: '""{Left}', swipe_down: "\\", key_back_color: bh3, key_text_color: th3}
      - {click: k, long_click: "''{Left}", key_back_color: bh3, key_text_color: th3}  # 替換n爲k
      - {click: m, long_click: ":", swipe_down: "|", key_back_color: bh3, key_text_color: th3}
      - {click: BackSpace, width: 15, key_back_color: bbs, key_text_color: tb3, hilited_key_back_color: gnb, hilited_key_text_color: tgn}

      # 第4行：
      - {click: Keyboard_number, width: 15, key_back_color: num, key_text_color: ntb, round_corner: *round3, hilited_key_back_color: num, hilited_key_text_color: ntb}
      - {click: Keyboard_bqrw, long_click: Theme_settings, swipe_down: Color_switch, swipe_up: Color_switch, width: 10, key_text_size: "18", key_back_color: bgn, key_text_color: th4}
      - {click: ',', label: '，', long_click: '!', key_back_color: bh4, key_text_color: th4}
      - {click: space, label_symbol: ' ', long_click: Keyboard_numberb, swipe_left: "Left", swipe_right: "Right", swipe_up: Schema_switchcn, width: 30, key_back_color: bkg, key_text_color: tkg, hilited_key_back_color: bgn, hilited_key_text_color: tgn}
      - {click: '.', label: '。', long_click: '?', key_back_color: bh4, key_text_color: th4}
      - {click: 'Mode_switch', long_click: liquid_keyboard_switch , key_text_size: "18", key_back_color: bgn, key_text_color: th4}
      - {click: Return, composing: Return1, swipe_up: Escape, width: 15, key_back_color: benter, key_text_color: tenter, round_corner: *round3, hilited_key_back_color: benter, hilited_key_text_color: tenter}

  number:
    author: "認真的π"
    name: 數字
    width: 16.6
